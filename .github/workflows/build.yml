
name: ASP.NET Core CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build ASP.NET Project
    runs-on: windows-latest

    steps:
      # Step 1: Get source code from GitHub
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Install .NET 8 SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Step 3: Restore NuGet packages
      - name: Restore Packages
        run: dotnet restore Frmework/Frmework.csproj

      # Step 4: Build ASP.NET project
      - name: Build Project
        run: dotnet build Frmework/Frmework.csproj --configuration Release --no-restore
